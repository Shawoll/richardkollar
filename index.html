  <style>
    @font-face {
      font-family: "IBM Plex Sans";
      font-style: normal;
      font-weight: 100 700;
      font-display: swap;
      src: url("assets/fonts/IBMPlexSans-Variable.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Sans";
      font-style: italic;
      font-weight: 100 700;
      font-display: swap;
      src: url("assets/fonts/IBMPlexSans-Italic-Variable.woff2") format("woff2");
    }

    :root {
      color-scheme: light dark;
      --page: #E4E9EF;
      --card: #FFFFFF;
      --ink: #15202B;
      --muted: #5A6978;
      --line: #D5DCE4;
      --accent: #1A5FC2;
      --button: #1A5FC2;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 16px 40px -16px rgba(16, 24, 40, .25);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0D131A;
        --card: #161E27;
        --ink: #E7EDF3;
        --muted: #98A6B5;
        --line: #273240;
        --accent: #7AB4FF;
        --button: #2B6FD6;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -16px rgba(0, 0, 0, .6);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--page);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 100%;
      line-height: 1.5;
    }

    /* The card: 3.5 x 2 inch proportions, photo slot left, details right */
    .card {
      width: 100%;
      max-width: 700px;
      aspect-ratio: 7 / 4;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 36px;
      align-items: center;
      padding: 36px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    /* Photo slot */
    .photo { margin: 0; min-width: 0; }
    .photo button {
      display: block;
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .photo button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .photo img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--line);
      transition: opacity 200ms ease;
    }
    .photo img.is-fading { opacity: 0; }
    .photo .fallback { display: none; }
    .photo.is-missing img { visibility: hidden; }
    .photo.is-missing .fallback {
      display: grid;
      place-items: center;
      position: absolute;
      inset: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--page);
      color: var(--muted);
      font-size: 0.875rem;
    }
    .photo figcaption {
      margin-top: 10px;
      font-size: 0.875rem;
      font-style: italic;
      line-height: 1.4;
      color: var(--muted);
    }

    /* Details */
    .details { min-width: 0; }
    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4.5vw, 2.375rem);
      font-weight: 600;
      letter-spacing: -0.015em;
      line-height: 1.1;
    }
    .role {
      margin: 0.375rem 0 0;
      font-size: 1rem;
      color: var(--muted);
    }
    .links {
      display: grid;
      grid-template-columns: 5.5rem 1fr;
      column-gap: 1rem;
      row-gap: 0.5rem;
      margin: 1.25rem 0 0;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      font-size: 0.9375rem;
    }
    .links dt { color: var(--muted); }
    .links dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .links a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.15em;
    }
    .links a:hover { text-decoration-thickness: 2px; }
    .links a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }
    /* Email: shown by CSS even without JS; JS replaces it with real, copyable text */
    .email:not(.is-ready)::after { content: attr(data-u) "\0040" attr(data-d); }

    /* Ko-fi: a plain link styled like their button, nothing loaded from Ko-fi */
    .kofi {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 2.5rem;
      margin-top: 1.5rem;
      padding: 0 0.75rem;
      border-radius: 7px;
      background: var(--button);
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
    }
    .kofi:hover { opacity: 0.85; }
    .kofi:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .kofi svg {
      width: 1.375rem;
      height: 1.375rem;
      animation: kofi-wiggle 3s infinite;
    }
    @keyframes kofi-wiggle {
      0%, 60%, 100% { transform: none; }
      75% { transform: scale(1.12); }
      80% { transform: scale(1.1); }
      84% { transform: rotate(-10deg) scale(1.1); }
      88% { transform: rotate(10deg) scale(1.1); }
      92% { transform: rotate(-10deg) scale(1.1); }
      96% { transform: rotate(10deg) scale(1.1); }
    }

    /* Portrait: below 720px the details column is too narrow, so the card stacks */
    @media (max-width: 719px) {
      .card {
        grid-template-columns: 1fr;
        aspect-ratio: auto;
        gap: 24px;
        padding: 24px;
      }
      .photo { max-width: 420px; }
    }
    @media (max-width: 600px) {
      .links {
        grid-template-columns: max-content 1fr;
        column-gap: 1rem;
        row-gap: 0.75rem;
      }
    }
    @media (max-width: 380px) {
      .links { grid-template-columns: 1fr; row-gap: 0.125rem; }
      .links dd + dt { margin-top: 0.625rem; }
      .links dt { font-size: 0.8125rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .photo img { transition: none; }
      .kofi svg { animation: none; }
    }
  </style>
  <noscript>
    <style>.photo button { display: none; }</style>
  </noscript>
</head>
<body>

          <path fill="#FF6433" d="M7.507 7.131c-1.818 0-3.013 1.48-3.013 3.142 0 1.533.858 2.857 1.949 3.897.727.701 1.87 1.429 2.649 1.896a1.47 1.47 0 0 0 1.507 0c.78-.467 1.922-1.195 2.623-1.896 1.117-1.039 1.974-2.364 1.974-3.897 0-1.662-1.247-3.142-3.039-3.142-1.065 0-1.792.545-2.338 1.298-.493-.753-1.246-1.298-2.312-1.298"/>

  </main>

  <script>
    (function () {
      var cats = [
        "https://placecats.com/600/400",
        "https://placecats.com/neo/600/400",
        "https://placecats.com/millie/600/400",
        "https://placecats.com/millie_neo/600/400",
        "https://placecats.com/neo_banana/600/400",
        "https://placecats.com/neo_2/600/400",
        "https://placecats.com/bella/600/400",
        "https://placecats.com/poppy/600/400",
        "https://placecats.com/louie/600/400",
        "https://placecats.com/g/600/400"
      ];
      var captions = [
        "Not me. Click for another cat.",
        "Still not me.",
        "Also not me.",
        "Definitely not me.",
        "Okay, this one might be me."
      ];

      var figure = document.querySelector(".photo");
      var button = figure.querySelector("button");
      var img = document.getElementById("cat");
      var caption = figure.querySelector("figcaption");
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var current = Math.floor(Math.random() * cats.length);
      var clicks = 0;

      function show(index) {
        current = index;
        figure.classList.remove("is-missing");
        img.src = cats[index];
      }

      function next() {
        var index = Math.floor(Math.random() * (cats.length - 1));
        if (index >= current) { index += 1; }
        clicks += 1;
        caption.textContent = captions[clicks % captions.length];
        if (reduceMotion) { show(index); return; }
        img.classList.add("is-fading");
        setTimeout(function () { show(index); }, 200);
      }

      img.addEventListener("load", function () { img.classList.remove("is-fading"); });
      img.addEventListener("error", function () {
        figure.classList.add("is-missing");
        img.classList.remove("is-fading");
        caption.textContent = "The cat server is napping.";
      });
      button.addEventListener("click", next);

      caption.textContent = captions[0];
      show(current);

      // Email: assembled here so the address never appears in the source
      var email = document.querySelector(".email");
      var user = email.getAttribute("data-u");
      var domain = email.getAttribute("data-d");
      email.href = "mailto:" + user + "@" + domain;
      email.textContent = "";
      email.appendChild(document.createTextNode(user));
      email.appendChild(document.createElement("wbr"));
      email.appendChild(document.createTextNode("@" + domain));
      email.removeAttribute("aria-label");
      email.classList.add("is-ready");

      console.log(
        "Hi. One HTML file, no build step, one random cat.\n" +
        "Source: https://github.com/Shawoll/richardkollar"
      );
    })();
  </script>
